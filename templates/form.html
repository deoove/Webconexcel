<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ accion }} Persona</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
    header { background: #2563eb; color: white; padding: 16px 32px; }
    header h1 { font-size: 1.4rem; }
    main { max-width: 480px; margin: 40px auto; padding: 0 16px; }
    .card { background: white; border-radius: 10px; padding: 32px; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
    h2 { margin-bottom: 24px; color: #2563eb; }
    label { display: block; margin-bottom: 4px; font-size: 0.85rem; font-weight: bold; color: #555; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; margin-bottom: 18px; }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 1rem; text-decoration: none; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-row { display: flex; gap: 12px; }
  </style>
</head>
<body>
<header>
  <h1>Gestión de Personas &mdash; Excel</h1>
</header>
<main>
  <div class="card">
    <h2>{{ accion }} Persona</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required
             value="{{ persona.nombre if persona else '' }}" placeholder="Ej: Juan">

      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" required
             value="{{ persona.apellido if persona else '' }}" placeholder="Ej: Pérez">

      <label for="dni">DNI</label>
      <input type="text" id="dni" name="dni" required
             value="{{ persona.dni if persona else '' }}" placeholder="Ej: 30123456">

      <div class="btn-row">
        <button type="submit" class="btn btn-primary">{{ accion }}</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
